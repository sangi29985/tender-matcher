[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender-matcher"
version = "0.1.0"
description = "Find public tenders relevant to a small company's capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=0.49",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
